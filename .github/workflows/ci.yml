name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            preview/package-lock.json
      - run: npm ci
      - run: npm --prefix preview ci
      - name: BrightScript specs and gateway tests
        run: npm test
      - name: Build the Roku package
        run: npm run build:roku
      - name: Browser preview tests
        run: npm --prefix preview test
      - name: Browser preview typecheck
        run: npm --prefix preview run typecheck
